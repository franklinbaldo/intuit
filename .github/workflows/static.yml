# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Setup Node for published-page capture
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Capture the page that was actually published
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: npx playwright test tests/playwright/visual-capture.spec.js --project=chromium
      - name: Write published-page provenance
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p artifacts/visual
          {
            echo "phase=published"
            echo "commit_sha=${GITHUB_SHA}"
            echo "route=${PUBLISHED_URL}"
            echo "viewports=1440x900,390x844"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/visual/metadata.txt
      - name: Upload published-page capture
        uses: actions/upload-artifact@v4
        with:
          name: intuit-published-${{ github.sha }}
          path: artifacts/visual/
          if-no-files-found: error
          retention-days: 30
