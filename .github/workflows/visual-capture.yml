name: Visual capture

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'utils.js'
      - 'tests/playwright/visual-capture.spec.js'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/visual-capture.yml'
  push:
    branches: [main]

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      CAPTURE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Capture home
        run: npx playwright test tests/playwright/visual-capture.spec.js --project=chromium
      - name: Write provenance
        run: |
          mkdir -p artifacts/visual
          {
            echo "commit_sha=${CAPTURE_SHA}"
            echo "route=/intuit/"
            echo "viewport=1440x900"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/visual/metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: intuit-home-${{ env.CAPTURE_SHA }}
          path: artifacts/visual/
          if-no-files-found: error
          retention-days: 30
